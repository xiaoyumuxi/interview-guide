[project]
name = "rag-lab"
version = "0.1.0"
description = "Offline, evidence-span-driven RAG chunking evaluation lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "markdown-it-py>=3.0",
  "markitdown>=0.1.4",
  "numpy>=2.0",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
qwen = ["sentence-transformers>=5.0", "torch>=2.6"]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

